name: Full CI

# Cross-platform and PTY coverage is deliberately off the per-commit hot path.
# Run it weekly, on demand, or by adding the `full-ci` label to a pull request.
on:
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * 1'
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: full-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  platform:
    name: Platform (Node ${{ matrix.node-version }} on ${{ matrix.os }})
    if: github.event_name != 'pull_request' || github.event.label.name == 'full-ci'
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node-version: 24.15.0
            timeout: 10
            experimental: false
          - os: macos-latest
            node-version: 22.22.2
            timeout: 25
            experimental: false
          - os: windows-latest
            node-version: 22.22.2
            timeout: 15
            experimental: true
    env:
      TZ: UTC
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run unit tests
        run: npm run test:unit

  e2e:
    name: PTY e2e journeys
    if: github.event_name != 'pull_request' || github.event.label.name == 'full-ci'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: UTC
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build packaged CLI
        run: npm run build

      - name: Configure git identity
        run: |
          git config --global user.name "Coco CI"
          git config --global user.email "ci@example.com"

      - name: Run PTY e2e journeys
        run: npm run test:e2e
