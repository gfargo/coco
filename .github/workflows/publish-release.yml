name: Publish Release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the already-versioned package to npm
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  verify:
    name: Verify release package
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run release gate
        run: npm test

      - name: Validate release dry run
        run: npm run release:dry-run

  publish:
    name: Publish package to npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: verify
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          registry-url: https://registry.npmjs.org
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  docker:
    name: Build & publish container image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: publish
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2

      - name: Resolve version
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Wait for npm to publish
        run: |
          for i in $(seq 1 30); do
            if npm view "git-coco@${{ steps.ver.outputs.version }}" version >/dev/null 2>&1; then
              echo "Found git-coco@${{ steps.ver.outputs.version }} on npm."
              exit 0
            fi
            echo "Not on npm yet, waiting… ($i/30)"
            sleep 10
          done
          echo "::error::git-coco@${{ steps.ver.outputs.version }} did not appear on npm in time."
          exit 1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          build-args: COCO_VERSION=${{ steps.ver.outputs.version }}
          tags: coco:smoke

      - name: Smoke test image
        run: docker run --rm coco:smoke --help

      - name: Build & push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: COCO_VERSION=${{ steps.ver.outputs.version }}
          tags: |
            ghcr.io/gfargo/coco:${{ steps.ver.outputs.version }}
            ghcr.io/gfargo/coco:latest
